name: Java CI

on: [push]

env:
  VAADIN_OFFLINE_KEY: ${{ secrets.SERVER_KEY }}

jobs:
  build:
    runs-on: windows-latest

    permissions:
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable
      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ${{ env.USERPROFILE }}\.m2\repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Cache frontend dependencies
        uses: actions/cache@v5
        with:
          path: |
            bookstore-starter-flow-ui/node_modules
            bookstore-starter-flow-my-component/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package.json', '**/pnpm-lock.yaml', '**/pnpm-workspace.yaml', '**/.npmrc', '**/pnpmfile.js') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-
      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots install -DskipTests
      - name: Run tests
        run: mvn --batch-mode verify -Pintergration-tests
      - name: Upload error screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: error-screenshots
          path: bookstore-starter-flow-it/error-screenshots
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            bookstore-starter-flow-backend/target/surefire-reports/*.xml
            bookstore-starter-flow-components/target/surefire-reports/*.xml
            bookstore-starter-flow-components/target/failsafe-reports/TEST-*.xml
            bookstore-starter-flow-ui/target/surefire-reports/*.xml
            bookstore-starter-flow-ui/target/failsafe-reports/TEST-*.xml
          